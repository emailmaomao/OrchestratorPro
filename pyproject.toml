[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestratorpro"
version = "1.0.0"
description = "A self-hosted control plane for fleets of AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OrchestratorPro contributors" }]
keywords = ["agents", "orchestration", "llm", "workflow", "ci"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]

# Everything here except PyYAML is reachable only from orchestrator/api/ and
# orchestrator/dashboard/, and a test enforces that.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    # The one dependency above L0 that is not a web-layer concern: the planner
    # reads YAML workflow files, and a hand-rolled YAML subset would accept
    # documents real YAML rejects, which is worse than the dependency.
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Model backends. None is required: the control plane records, plans, and
# reports without one, and provider selection is the operator's decision.
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",  # the dependency audit SECURITY.md requires
]

[project.urls]
Homepage = "https://github.com/emailmaomao/OrchestratorPro"
Repository = "https://github.com/emailmaomao/OrchestratorPro"
Issues = "https://github.com/emailmaomao/OrchestratorPro/issues"

[project.scripts]
orchestratorpro = "orchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
# The dashboard is served from disk rather than bundled, so its assets have to
# travel with the wheel. Without this the UI is a 404 in every installed copy.
"orchestrator.dashboard" = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: touches a real network or a real model backend; never run by default",
    "slow: takes long enough to be worth skipping during iteration",
]
filterwarnings = [
    "error::DeprecationWarning:orchestrator.*",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
# S = flake8-bandit. Every finding it raises in orchestrator/ is either fixed
# or waived per line with a reason, so a *new* one is visible rather than lost
# in a standing list. See SECURITY.md.
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D", "S"]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Tests assert (S101) and drive real subprocesses on purpose (S603/S607);
# they also build throwaway credentials (S105/S106) and use `random` for
# fixtures (S311). Enforcing bandit there would be noise, not safety.
"tests/*" = ["D100", "D103", "S101", "S105", "S106", "S311", "S603", "S607"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = false
exclude = ["^\\.venv/", "^build/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.run]
source = ["orchestrator"]
omit = ["*/dashboard/static/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
